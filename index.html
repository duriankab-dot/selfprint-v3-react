<!doctype html>
<!-- DARKNAVY-001: data-mode="dark" is set statically here (not by JS
     after mount) so the very first pixels the browser paints — before
     React/ThemeContext even runs — are the dark navy blue base theme,
     not a white flash. ThemeContext.tsx still fully controls the theme
     after hydration (a returning user's stored 'light' choice, or a
     mood/AI-selected accent, applies immediately via useLayoutEffect
     before the browser gets a chance to paint the wrong one). -->
<html lang="th" data-mode="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- ✅ Viewport - ปรับให้รองรับมือถือดีขึ้น -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />

    <!-- Theme -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- App metadata -->
    <title>Selfprint — Living AI Twin</title>
    <meta name="description" content="AI ที่เรียนรู้และเข้าใจตัวคุณ — Living Personal Intelligence Platform" />
    <meta name="application-name" content="Selfprint" />

    <!-- Apple PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Selfprint" />

    <!-- Apple splash screens (portrait primary) -->
    <!-- iPhone 14 Pro Max -->
    <!-- iPhone 14 / 13 / 12 -->
    <!-- iPhone SE / 8 / 7 / 6s -->

    <!-- LIGHTHOUSE-001: trimmed from 6 preconnects to 1. Lighthouse flagged
         all 6 as "Unused preconnect" and this was correct, not a false
         positive — verified by grepping src/ for each origin:
           - api.anthropic.com: never called from the browser (proxied
             server-side through this app's own /api/nova function) — removed.
           - fonts.googleapis.com / fonts.gstatic.com: no <link rel=stylesheet>
             or @import for Google Fonts anywhere in the app (tokens.css uses
             system font stacks only) — removed.
           - supabase.co (bare): wrong host entirely — the app connects to
             the project subdomain, not the marketing domain, so the browser
             never actually used this hint. Corrected to the real project
             URL below (Supabase session check does run on every page load,
             so this is the one origin actually worth preconnecting).
           - api.stripe.com / js.stripe.com: Stripe isn't integrated
             client-side yet (no loadStripe/@stripe usage anywhere) — removed.
             Re-add if/when checkout ships. -->
    <link rel="preconnect" href="https://orxteufqeohptpbwkqx.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://orxteufqeohptpbwkqx.supabase.co" />

    <!-- Open Graph / Social — updated for GEO/AEO (MetaTagManager overrides per-page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SELFPRINT" />
    <meta property="og:title" content="SELFPRINT | Living Personal Intelligence Platform" />
    <meta property="og:description" content="AI Twin ที่เรียนรู้จากคุณจริงๆ — 12 SICE Core Engines วิเคราะห์พฤติกรรม ตรวจจับ Blind Spots และช่วยตัดสินใจ" />
    <!-- OGSTATIC-001 / OGABS-001 (3 ก.ย. 2026): เดิมชี้ไป /api/og ซึ่งคืน
         Content-Type: text/html ไม่ใช่รูป → preview พังทุกช่อง และยังเป็น
         root-relative path ซึ่ง crawler ของ Facebook/X/LINE ไม่ resolve ให้
         ตอนนี้เป็นไฟล์ .jpg static 1200×630 ใน public/ + absolute URL -->
    <meta property="og:image" content="https://selfprint.one/og-default-th.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://selfprint.one" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@selfprintone" />
    <meta name="twitter:title" content="SELFPRINT | Living Personal Intelligence Platform" />
    <meta name="twitter:description" content="AI Twin ที่เรียนรู้จากคุณจริงๆ — 12 SICE Engines วิเคราะห์ชีวิต ไม่ใช่ดูดวง" />
    <meta name="twitter:image" content="https://selfprint.one/og-default-th.jpg" />
    <!-- ASSET404-001 (4 ก.ย. 2026): ไฟล์นี้ไม่มีอยู่จริงใน public/ — ชี้ไปที่ไอคอนที่มีจริงแทน
         ลบ <link rel="apple-touch-startup-image"> 3 อันที่ชี้ splash-*.png
         ซึ่งไม่เคยมีไฟล์อยู่จริง iOS จะ fallback ไปใช้พื้นหลังของ manifest เอง -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
