name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # NODE-22-001: ต้องตรงกับ testing.yml (Node 22) — Node 20 ทำให้
          # jsdom@30 → undici ล้มด้วย "webidl.util.markAsUncloneable is not a
          # function" ทุก worker (71 test files start ไม่ขึ้น)
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Astro Language Check
        # CI gate ต้องรัน script เดียวกับ local (.ai/scripts) — raw grep เดิมมี
        # allow-list ไม่ตรงกับ script ทำให้ false failure บนไฟล์ที่ allowed อยู่แล้ว
        run: npm run check:astro

      - name: Token Compliance Check
        # ใช้ script เดียวกับ local: ไฟล์ใน fix-list (Phase 0 audit) ได้รับยกเว้น
        # ตามแผนย้ายทีละ batch — raw grep เดิม flag ทุกไฟล์รวม fix-list
        run: npm run check:tokens