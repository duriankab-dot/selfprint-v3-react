name: Lighthouse CI (Phase 3)

on:
  workflow_dispatch:
  schedule:
    # Nightly against the staging alias — 0:30 UTC
    - cron: '30 0 * * *'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'lighthouserc.json'

env:
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run Lighthouse CI against staging
        # TC-312: thresholds live in ./lighthouserc.json —
        # Perf >= 0.7 (70), A11y >= 0.9 (90), Best Practices >= 0.9 (90), SEO >= 0.95 (95).
        # Owner decision (27 Sep 2026): keep Perf >= 0.7 as the stable CI/CD baseline —
        # the historical MASTER_PLAN Phase 3 wording "Perf >= 90, A11y >= 95" is superseded;
        # raising to 0.9 would require a real perf-optimization batch (e.g. code-split
        # vendor-misc ~555 kB) — not approved for this phase.
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://selfprint-staging.pages.dev/th/
            https://selfprint-staging.pages.dev/th/science
            https://selfprint-staging.pages.dev/th/pricing
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Notify Slack - Lighthouse
        if: always() && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        run: |
          curl --globoff -X POST "${{ env.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "Lighthouse CI",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Lighthouse CI*\n*Status:* ${{ job.status }}\n*Ref:* ${{ github.ref_name }}"
                  }
                }
              ]
            }'