name: Phase Gate Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: 'Phase to validate'
        required: true
        options:
          - '0'
          - '1'
          - '2'
          - '3'

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # NODE-22-001: ต้องตรงกับ testing.yml (Node 22) — Node 20 ทำให้
          # jsdom@30 → undici ล้มทุก worker
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Astro Language Check
        # ใช้ script เดียวกับ local (.ai/scripts) — allow-list ตรงกัน
        run: npm run check:astro

      - name: Token Compliance Check
        # ใช้ script เดียวกับ local — fix-list ได้รับยกเว้นตามแผน TC-208
        run: npm run check:tokens

      - name: MASTER_PLAN Sync Check
        # แก้ path: ไฟล์จริงคือ validate-master-plan.cjs (เดิมอ้าง .js → ไม่มีไฟล์)
        run: npm run check:master-plan

      - name: Lighthouse CI (Phase 1+)
        if: github.event.inputs.phase != '0'
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.numberOfRuns=1 --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}