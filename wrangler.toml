name = "selfprint-v3-react"
compatibility_date = "2024-12-01"

# KV Namespace Bindings for Rate Limiting
# Rate limiter persists state in CF KV across all edge locations
# Setup: Create a KV namespace named "RATE_LIMIT_KV" in CF Dashboard,
# then bind it via: Settings -> Functions -> KV namespace bindings
# -> Add binding: Variable name = RATE_LIMIT_KV, Namespace ID = <your-ns-id>
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "rate-limit-kv-production"
preview_id = "rate-limit-kv-preview"

# CF-PAGES-MIGRATION-001: pages_build_output_dir was added here briefly,
# but that key is exactly what switches a CF Pages project onto the
# "Wrangler configuration file (BETA)" deploy path — and in that mode this
# project's Dashboard-configured Environment Variables were NOT being
# passed to the Functions worker at all (build log kept showing
# "Build environment variables: (none found)" even after they were set,
# and the Functions worker crashed at init on missing Supabase env vars).
# Reverted to the config that already deployed successfully 35+ times:
# CF Pages reads build output dir / build command from the Dashboard
# (Settings -> Builds & deployments), not from this file.
#
# nodejs_compat (needed by functions/api/[[route]].ts -> unified-handler.ts,
# which reads process.env.* and uses Buffer) must be set via Dashboard ->
# Settings -> Functions -> Compatibility flags, for both Production and
# Preview -- it is not reliably picked up from this file on the classic
# (non-Wrangler-config) Pages deploy path.
