name = "selfprint-v3-react"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[env.production]
name = "selfprint-v3-react-production"

# Cloudflare Pages specific config
[build]
command = "npm run build"
cwd = "."
watch_paths = ["src/**/*.ts", "src/**/*.tsx", "public/**/*"]

[build.upload]
format = "service-worker"

# Serve dist/ as root
[[routes]]
pattern = "/*"
zone_id = ""

# Static assets (include public/blog/)
[[routes]]
pattern = "/blog/*"
zone_id = ""

# Cache blog articles (public/blog/)
[[routes]]
pattern = "/blog/index.json"
zone_id = ""
custom_domain = false
