name = "selfprint-v3-react"
compatibility_date = "2024-12-01"

# CF-PAGES-MIGRATION-001: this file previously targeted the CF Workers
# format (main = "src/index.ts", which doesn't exist; [[routes]]/zone_id,
# [build.upload] format = "service-worker" — all Workers Sites concepts,
# inert for a Pages project). Replaced with the actual Cloudflare Pages
# Functions config:
#   - pages_build_output_dir: where `npm run build` (vite build) writes
#   - compatibility_flags nodejs_compat: required for functions/api/[[route]].ts
#     -> api/unified-handler.ts, which reads process.env.* (Supabase,
#     Stripe keys) and uses Buffer — neither exists in the raw Workers
#     runtime without this flag.
pages_build_output_dir = "dist"
compatibility_flags = ["nodejs_compat"]
